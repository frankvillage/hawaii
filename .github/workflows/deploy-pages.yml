name: Deploy GitHub Pages preview

on:
  push:
    branches:
      - main
      - claude/codex-handoff-assets-se8fjq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Verify source and types
        run: |
          npm run test:web:journey
          npm run test:web:booking
          npm run test:web:static
          ./web/node_modules/.bin/tsc --noEmit -p web/tsconfig.json
          npm --prefix web run lint -- --max-warnings=0

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Drop server-only API routes
        run: rm -rf web/src/app/api

      - name: Build static export
        working-directory: web
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run build -- --webpack

      - name: Prefix root media URLs
        run: |
          find web/out -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.txt' \) -print0 |
            xargs -0 sed -i \
              -e 's|"/media/|"/${{ github.event.repository.name }}/media/|g' \
              -e "s|'/media/|'/${{ github.event.repository.name }}/media/|g" \
              -e 's|(/media/|(/${{ github.event.repository.name }}/media/|g'

      - name: Stage and test exact Pages artifact
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          rm -rf pages-preview
          mkdir -p pages-preview/${{ github.event.repository.name }}
          cp -a web/out/. pages-preview/${{ github.event.repository.name }}/
          npm run test:web:production

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
